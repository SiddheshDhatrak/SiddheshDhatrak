name: Update GitHub Stats SVGs

on:
  # Run every 6 hours
  schedule:
    - cron: "0 */6 * * *"

  # Allow manual trigger
  workflow_dispatch:

  # Run on push to main/master (only when this workflow changes)
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/update-stats.yml"

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create stats directory
        run: mkdir -p stats

      # Fetch GitHub Stats SVG
      - name: Fetch GitHub Stats SVG
        run: |
          curl -s -o temp-stats.svg "https://github-readme-stats.vercel.app/api?username=SiddheshDhatrak&show_icons=true&theme=tokyonight&hide_border=true"
          if grep -q "Something went wrong" temp-stats.svg || ! grep -q "<svg" temp-stats.svg; then
            echo "::warning::GitHub Stats API returned an error or invalid SVG. Keeping existing file."
          else
            mv temp-stats.svg stats/github-stats.svg
            echo "✅ Successfully fetched new GitHub Stats"
          fi
          rm -f temp-stats.svg

      # Fetch Top Languages SVG
      - name: Fetch Top Languages SVG
        run: |
          curl -s -o temp-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=SiddheshDhatrak&layout=compact&theme=tokyonight&hide_border=true"
          if grep -q "Something went wrong" temp-langs.svg || ! grep -q "<svg" temp-langs.svg; then
            echo "::warning::Top Languages API returned an error or invalid SVG. Keeping existing file."
          else
            mv temp-langs.svg stats/top-languages.svg
            echo "✅ Successfully fetched new Top Languages"
          fi
          rm -f temp-langs.svg

      # Generate GitHub Streak SVG
      - name: Generate GitHub Streak SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=SiddheshDhatrak&theme=tokyonight&hide_border=true
          path: stats/github-streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate SVG files
        run: |
          echo "=== Validating SVG files ==="
          for file in stats/github-stats.svg stats/top-languages.svg stats/github-streak.svg; do
            if [ -f "$file" ] && head -c 100 "$file" | grep -q '<svg'; then
              size=$(wc -c < "$file")
              echo "✅ $file is valid ($size bytes)"
            else
              echo "❌ $file is missing or invalid"
            fi
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update GitHub stats SVGs [skip ci]"
            git push
          fi
