name: Update GitHub Stats SVGs

on:
  # Run every 6 hours
  schedule:
    - cron: "0 */6 * * *"

  # Allow manual trigger
  workflow_dispatch:

  # Run on push to main/master
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/update-stats.yml"

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create stats directory
        run: mkdir -p stats

      - name: Fetch GitHub Stats SVG
        run: |
          for i in 1 2 3; do
            curl -s -o stats/github-stats.svg \
              "https://github-readme-stats.vercel.app/api?username=SiddheshDhatrak&show_icons=true&theme=tokyonight&hide_border=true" \
              && break || sleep 10
          done
          # Validate that we got a valid SVG
          if ! head -c 100 stats/github-stats.svg | grep -q '<svg'; then
            echo "::warning::GitHub Stats SVG may be invalid, retrying with alternate instance..."
            curl -s -o stats/github-stats.svg \
              "https://github-readme-stats.vercel.app/api?username=SiddheshDhatrak&show_icons=true&theme=tokyonight&hide_border=true"
          fi

      - name: Fetch Top Languages SVG
        run: |
          for i in 1 2 3; do
            curl -s -o stats/top-languages.svg \
              "https://github-readme-stats.vercel.app/api/top-langs/?username=SiddheshDhatrak&layout=compact&theme=tokyonight&hide_border=true" \
              && break || sleep 10
          done
          if ! head -c 100 stats/top-languages.svg | grep -q '<svg'; then
            echo "::warning::Top Languages SVG may be invalid, retrying..."
            curl -s -o stats/top-languages.svg \
              "https://github-readme-stats.vercel.app/api/top-langs/?username=SiddheshDhatrak&layout=compact&theme=tokyonight&hide_border=true"
          fi

      - name: Fetch GitHub Streak SVG
        run: |
          for i in 1 2 3; do
            curl -s -o stats/github-streak.svg \
              "https://streak-stats.demolab.com/?user=SiddheshDhatrak&theme=tokyonight&hide_border=true" \
              && break || sleep 10
          done
          if ! head -c 100 stats/github-streak.svg | grep -q '<svg'; then
            echo "::warning::Streak SVG may be invalid, retrying..."
            curl -s -o stats/github-streak.svg \
              "https://streak-stats.demolab.com/?user=SiddheshDhatrak&theme=tokyonight&hide_border=true"
          fi

      - name: Validate SVG files
        run: |
          echo "=== Validating SVG files ==="
          for file in stats/github-stats.svg stats/top-languages.svg stats/github-streak.svg; do
            if [ -f "$file" ] && head -c 100 "$file" | grep -q '<svg'; then
              echo "✅ $file is valid ($(wc -c < "$file") bytes)"
            else
              echo "❌ $file is missing or invalid"
            fi
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update GitHub stats SVGs [skip ci]"
            git push
          fi
