name: Update GitHub Stats SVGs

on:
  # Run every 6 hours
  schedule:
    - cron: "0 */6 * * *"

  # Allow manual trigger
  workflow_dispatch:

  # Run on push to main/master (only when this workflow changes)
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/update-stats.yml"

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create stats directory
        run: mkdir -p stats

      # Generate GitHub Stats card using the dedicated action (uses GITHUB_TOKEN, no external API)
      - name: Generate GitHub Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=SiddheshDhatrak&show_icons=true&theme=tokyonight&hide_border=true
          path: stats/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Generate Top Languages card
      - name: Generate Top Languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=SiddheshDhatrak&layout=compact&theme=tokyonight&hide_border=true
          path: stats/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Fetch GitHub Streak SVG (streak-stats doesn't have a native action, use curl with retries)
      - name: Fetch GitHub Streak SVG
        run: |
          for i in 1 2 3 4 5; do
            curl -s -f -o stats/github-streak.svg \
              "https://streak-stats.demolab.com/?user=SiddheshDhatrak&theme=tokyonight&hide_border=true" \
              && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          # Check if we got a valid streak SVG (not an error page)
          if head -c 500 stats/github-streak.svg | grep -q 'Failed to retrieve'; then
            echo "::warning::Streak SVG contains an error message, trying alternate URL..."
            curl -s -f -o stats/github-streak.svg \
              "https://github-readme-streak-stats.herokuapp.com/?user=SiddheshDhatrak&theme=tokyonight&hide_border=true" || true
          fi

      - name: Validate SVG files
        run: |
          echo "=== Validating SVG files ==="
          for file in stats/github-stats.svg stats/top-languages.svg stats/github-streak.svg; do
            if [ -f "$file" ] && head -c 100 "$file" | grep -q '<svg'; then
              size=$(wc -c < "$file")
              echo "✅ $file is valid ($size bytes)"
            else
              echo "❌ $file is missing or invalid"
            fi
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update GitHub stats SVGs [skip ci]"
            git push
          fi
